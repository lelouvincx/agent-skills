default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: amp-validator-tests
        name: Test Amp documentation validator
        entry: python -m unittest amp/scripts/test_validate_plugin_docs.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(?:amp/(?:docs/(?:issues|tools)|plugins)/|amp/scripts/(?:logseq-manual-log\.test\.ts|(?:test_validate_plugin_docs|validate-plugin-docs)\.py)$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: validate-amp-artifacts
        name: Validate Amp artifact and issue docs
        entry: python amp/scripts/validate-plugin-docs.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        files: ^(?:amp/(?:docs/(?:issues|tools)|plugins)/|amp/scripts/(?:logseq-manual-log\.test\.ts|(?:test_validate_plugin_docs|validate-plugin-docs)\.py)$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: validate-amp-rfcs
        name: Validate Amp RFCs
        entry: python3 amp/scripts/validate-rfcs.py
        language: system
        pass_filenames: false
        files: ^(?:amp/docs/rfcs/|amp/scripts/validate-rfcs\.py$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: validate-agent-secrets
        name: Validate agent secret capability policy
        entry: python amp/scripts/validate-agent-secrets.py
        language: python
        additional_dependencies: [jsonschema==4.25.1]
        pass_filenames: false
        files: ^(?:amp/agent-secrets/|amp/scripts/test-agent-secrets-lib\.sh$|amp/scripts/(?:test_agent_secrets|test_validate_agent_secrets|validate-agent-secrets)\.py$|bin/agent-secrets$|sync-skills\.sh$|scripts/check-projection$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: test-agent-secrets
        name: Test agent secret capability resolver
        entry: bash -c 'amp/scripts/test-agent-secrets-lib.sh && python -m unittest amp/scripts/test_validate_agent_secrets.py amp/scripts/test_agent_secrets.py'
        language: python
        additional_dependencies: [jsonschema==4.25.1]
        pass_filenames: false
        files: ^(?:amp/agent-secrets/|amp/scripts/test-agent-secrets-lib\.sh$|amp/scripts/(?:test_agent_secrets|test_validate_agent_secrets|validate-agent-secrets)\.py$|bin/agent-secrets$|sync-skills\.sh$|scripts/check-projection$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: validate-github-thread-events
        name: Validate GitHub thread event configuration
        entry: python amp/scripts/validate-github-thread-events.py
        language: python
        additional_dependencies: [jsonschema==4.25.1]
        pass_filenames: false
        files: ^(?:amp/github-thread-events/|amp/scripts/(?:test_validate_github_thread_events|validate-github-thread-events)\.py$|sync-skills\.sh$|scripts/check-projection$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: test-github-thread-events
        name: Test GitHub thread event configuration
        entry: python -m unittest amp/scripts/test_validate_github_thread_events.py
        language: python
        additional_dependencies: [jsonschema==4.25.1]
        pass_filenames: false
        files: ^(?:amp/github-thread-events/|amp/scripts/(?:test_validate_github_thread_events|validate-github-thread-events)\.py$|sync-skills\.sh$|scripts/check-projection$|\.github/workflows/ci\.yml$|\.pre-commit-config\.yaml$)

      - id: shell-syntax
        name: Check shell syntax
        entry: bash -n
        language: system
        types: [shell]

      - id: check-amp-runner
        name: Test Amp runner LaunchAgent manager
        entry: scripts/check-amp-runner
        language: system
        pass_filenames: false
        files: ^(?:bin/amp-runner$|scripts/check-amp-runner$|README\.md$|\.pre-commit-config\.yaml$)

      - id: check-amp-runner-logs
        name: Test Amp runner log rotation and backup
        entry: scripts/check-amp-runner-logs
        language: system
        pass_filenames: false
        files: ^(?:bin/amp-runner-logs$|scripts/check-amp-runner-logs$|amp/docs/tools/amp-runner-logs\.md$|amp/agent-secrets/bundles\.json$|README\.md$|\.pre-commit-config\.yaml$)

      - id: generated-project-docs
        name: Check generated project documentation
        entry: >-
          bash -c 'tmp="$(mktemp)"; trap '\''rm -f "$tmp"'\'' EXIT;
          AGENTS_REGISTRY_ENV=local AGENTS_REGISTRY_WORKSPACE_ROOT="$HOME/Developer"
          python bin/project-resolve --generate-md > "$tmp" && diff -u PROJECTS.md "$tmp"'
        language: python
        additional_dependencies: [PyYAML==6.0.3, rapidfuzz==3.14.3]
        pass_filenames: false
        files: ^(?:projects\.yaml|PROJECTS\.md|bin/project-resolve|scripts/check-project-registry|\.pre-commit-config\.yaml)$

      - id: check-skill-dependencies
        name: Check skill dependencies
        entry: scripts/check-skill-dependencies
        language: system
        pass_filenames: false
        files: ^(?:skills/|remote-skills\.yaml$|sync-skills\.sh$|scripts/check-skill-dependencies$|\.pre-commit-config\.yaml$)

      - id: check-projection
        name: Check isolated runtime projection
        entry: scripts/check-projection
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(?:\.agents/|amp/|bin/|skills/|projects\.yaml$|PROJECTS\.md$|remote-skills\.yaml$|sync-skills\.sh$|scripts/(?:check-projection|check-skill-dependencies)$|\.pre-commit-config\.yaml$)

      - id: check-remote-archive-sync
        name: Check rollback-safe remote archive syncing
        entry: scripts/check-remote-archive-sync
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(?:remote-skills\.yaml$|sync-skills\.sh$|scripts/check-remote-archive-sync$|\.pre-commit-config\.yaml$)

      - id: check-project-resolver
        name: Check project resolver behavior
        entry: scripts/check-project-resolver
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(?:projects\.yaml$|PROJECTS\.md$|bin/project-resolve$|scripts/check-project-resolver$|\.pre-commit-config\.yaml$)

      - id: check-plugin-builds
        name: Build Amp plugins
        entry: scripts/check-plugin-builds
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(?:amp/(?:mcp-servers/.*\.mjs$|plugins/.*\.ts$|scripts/(?:git-diff-mcp\.test|github-thread-events\.test|logseq-manual-log\.test|test-claude-design-subagent)\.ts$)|scripts/check-plugin-builds$|\.pre-commit-config\.yaml$)

      - id: validate-sdk
        name: Validate SDK dependencies
        entry: npm ci --prefix sdk
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(?:sdk/|\.pre-commit-config\.yaml$)
