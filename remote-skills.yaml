# Remote Skills Configuration
# Format:
#   name: skill-directory-name (must match directory under skills/)
#   url: raw URL to remote SKILL.md file, or
#   archive: URL to a tar.gz containing the complete skill directory
#   archive_path: skill directory path below the archive's top-level directory
#   enabled: true/false (set to false to temporarily disable syncing)
#   files: (optional) list of companion files relative to SKILL.md URL
#
# The sync process will:
#   1. Fetch the remote SKILL.md from the URL
#   2. Strip unsupported model-invocation controls from its frontmatter
#   3. Merge a PERSONAL.md description override and append its Markdown body
#   4. Generate skills/<name>/SKILL.md (this file is gitignored)
#   5. Store metadata in skills/<name>/.remote-source
#   6. Fetch listed companion files, or stage and replace the skill from an archive

